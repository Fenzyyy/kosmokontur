name: web integration

on:
  push:
    branches: ["feature/web-app", "main"]
  pull_request:
    branches: ["main"]

jobs:
  web-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run web integration tests
        run: PYTHONPATH=. pytest -q tests/test_web_api.py

      - name: Verify frontend JavaScript syntax
        run: node --check frontend/app.js

      - name: Verify frontend has no external runtime URLs
        shell: python
        run: |
          from pathlib import Path
          text = Path("frontend/index.html").read_text(encoding="utf-8")
          js = Path("frontend/app.js").read_text(encoding="utf-8")
          forbidden = ("https://", "http://")
          assert not any(x in text for x in forbidden), "external URL found in frontend/index.html"
          assert "cdn." not in js.lower(), "CDN reference found in frontend/app.js"
